version: '3.8'

services:
  work-intelligence:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AFTERGRAPH_API_TOKEN=${AFTERGRAPH_API_TOKEN:-changeme}
      - AFTERGRAPH_RATE_LIMIT=60
      - AFTERGRAPH_EVIDENCE_SECRET=${AFTERGRAPH_EVIDENCE_SECRET:-secret}
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
