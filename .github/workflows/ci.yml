name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/test_adapters.py tests/test_policy.py tests/test_transitions.py \
                 tests/test_publishers_v2.py tests/test_e2e_flow.py tests/test_evidence_metrics.py \
                 tests/test_api.py tests/test_api_v2.py tests/test_extractor.py \
                 tests/test_service.py -v --tb=short

      - name: Run adversarial tests
        run: pytest tests/test_adversarial.py -v --tb=short

      - name: Run recovery tests
        run: pytest tests/test_recovery.py -v --tb=short

      - name: Run performance benchmarks
        run: pytest tests/test_performance.py -v --tb=short -s

  integration:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: renos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up RenOS operations
        run: |
          # Apply migrations
          for f in $(ls ../intelligence-systems-research/../Renos-Control/backend/operations/supabase/migrations/*.sql 2>/dev/null | sort); do
            psql -f "$f" -U postgres -d renos_test || true
          done

      - name: Run live integration tests
        env:
          RENOS_SESSION_TOKEN: ${{ secrets.RENOS_SESSION_TOKEN }}
        run: |
          pytest tests/test_live_integration.py -v --tb=short || echo "Live tests skipped (no token)"
