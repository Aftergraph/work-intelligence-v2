name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Run unit tests with coverage
        run: |
          pytest tests/test_adapters.py tests/test_policy.py tests/test_transitions.py \
                 tests/test_publishers_v2.py tests/test_e2e_flow.py tests/test_evidence_metrics.py \
                 tests/test_api_v2.py tests/test_api_v3.py tests/test_extractor.py \
                 tests/test_service.py -v --tb=short --cov=src/aftergraph_work_intelligence \
                 --cov-report=xml --cov-report=term-missing

      - name: Run adversarial tests
        run: pytest tests/test_adversarial.py tests/test_adversarial_v2.py -v --tb=short

      - name: Run recovery tests
        run: pytest tests/test_recovery.py -v --tb=short

      - name: Run performance benchmarks
        run: pytest tests/test_performance.py -v --tb=short -s

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: renos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run cross-repo integration tests
        run: pytest tests/test_crossrepo_integration.py -v --tb=short

      - name: Run shadow dogfood tests
        run: pytest tests/test_shadow_dogfood.py -v --tb=short

  live-integration:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renos
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start RenOS operations
        run: |
          cd ../Renos-Control/backend/operations
          npm ci
          node server.mjs &
          sleep 5

      - name: Bootstrap RenOS owner
        run: |
          cd ../Renos-Control/backend/operations
          node scripts/bootstrap-owner.mjs --organization-name "TestOrg" --staff-name "Owner" --email owner@test.dk || true

      - name: Run live integration tests
        env:
          RENOS_SESSION_TOKEN: ${{ secrets.RENOS_SESSION_TOKEN }}
        run: pytest tests/test_live_integration.py -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aftergraph-work-intelligence .

      - name: Test Docker image
        run: |
          docker run -d -p 8087:8087 --name work-intelligence aftergraph-work-intelligence
          sleep 3
          curl -f http://localhost:8087/healthz || exit 1
          docker stop work-intelligence

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag aftergraph-work-intelligence aftergraph/work-intelligence:${{ github.sha }}
          docker tag aftergraph-work-intelligence aftergraph/work-intelligence:latest
          docker push aftergraph/work-intelligence:${{ github.sha }}
          docker push aftergraph/work-intelligence:latest
